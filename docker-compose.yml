services:
  web:
    image: brucelyc/audit:latest
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: audit
      DB_PASS: ${MYSQL_PASSWORD:-auditpass}
      DB_NAME: audit
      AP_USER: ${AP_USER:-admin}
      AP_PASS: ${AP_PASS:-admin}
    volumes:
      - logs_data:/var/www/html/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: audit
      MYSQL_USER: audit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auditpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
      - ./audit.sql:/docker-entrypoint-initdb.d/audit.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  logs_data:
